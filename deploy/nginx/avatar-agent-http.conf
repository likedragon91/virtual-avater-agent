# 仅用于“没有域名、先用 IP 测试”的 Nginx 配置。
# 正式上线请使用 avatar-agent.conf（域名 + HTTPS）。
#
# 放到 /etc/nginx/conf.d/avatar-agent.conf
# 并修改 server_name 和 root。

server {
    listen 80;
    listen [::]:80;
    # 替换为你的服务器 IP；保持 _ 表示匹配任意 Host
    server_name _;

    root /var/www/avatar-agent/dist;
    index index.html;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # 后端 API；后端路径本身包含 /api，不做 rewrite
    location /api/ {
        proxy_pass http://127.0.0.1:1107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 必须关闭缓冲并加长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
