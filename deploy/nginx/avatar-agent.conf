# 虚拟形象前端 + 后端 API 的 Nginx 配置
#
# 放置位置示例：
#   /etc/nginx/conf.d/avatar-agent.conf
#
# 部署前替换：
#   YOUR_DOMAIN          域名，如 avatar.example.com
#   /var/www/avatar-agent/dist   前端 dist 目录
#   /etc/letsencrypt/live/YOUR_DOMAIN/...  证书路径

# HTTP 强制跳转 HTTPS（Service Worker / Web Push 需要 HTTPS）
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/avatar-agent/dist;
    index index.html;

    # 上传文件大小限制，按需调整
    client_max_body_size 10m;

    # ===== 安全响应头 =====
    # 注意：如果某个 location 里再写 add_header，会覆盖这里的所有头；
    # 因此本文件的 location 只使用 expires，不再重复 add_header。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ===== 压缩 =====
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # ===== SPA 路由回退 =====
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== 带 hash 的构建产物：长缓存 =====
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # ===== Service Worker：禁止缓存 =====
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # ===== 后端 API 反向代理 =====
    # 后端控制器路径本身包含 /api，因此这里保持原样转发，不做 rewrite。
    location /api/ {
        proxy_pass http://127.0.0.1:1107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE（对话流、通知流）必须关闭缓冲并加长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ===== 头像等静态文件（可选） =====
    # 如果头像文件由服务器目录提供，取消注释并修改路径。
    # location /files/ {
    #     alias /var/www/avatar-agent/files/;
    #     expires 7d;
    # }
}
