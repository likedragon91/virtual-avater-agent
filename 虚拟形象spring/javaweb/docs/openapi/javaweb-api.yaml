components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      description: 会话 id
      schema:
        type: integer
        format: int64
    TaskId:
      name: id
      in: path
      required: true
      description: 任务 id
      schema:
        type: integer
        format: int64
  responses:
    Unauthorized:
      description: 未登录或 token 失效（HTTP 401）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "401"
            msg: 未登录或登录已过期
            data: null
    Forbidden:
      description: 已登录但没有访问权限（HTTP 403）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "403"
            msg: 没有访问权限
            data: null
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 50
          description: 用户名或邮箱
          example: admin
        password:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
          description: 前端 SM3 后的 64 位十六进制摘要（不是明文密码）
          example: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        captchaId:
          type: string
          maxLength: 64
          description: 验证码标识，来自 GET /user/captcha
          example: 3f2b6c1e-8b7a-4f6e-9a1d-2c3d4e5f6a7b
        captchaCode:
          type: string
          maxLength: 10
          description: 用户输入的验证码
          example: A1B2
        clientType:
          type: string
          enum: [DESKTOP, WEB]
          default: WEB
          description: |
            客户端类型。DESKTOP（Electron）Access 1h / Refresh 30d；
            WEB（浏览器、PWA）Access 30min / Refresh 14d。
          example: WEB
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          maxLength: 4096
          description: 登录或刷新接口返回的 refreshToken
          example: eyJhbGciOiJIUzI1NiJ9.rrr.zzz
    RegisterRequest:
      type: object
      required: [username, email, password, confirmPassword]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9_]+$'
          description: 只能包含字母、数字和下划线
          example: test_user
        email:
          type: string
          format: email
          maxLength: 50
          example: test@example.com
        nickname:
          type: string
          maxLength: 50
          example: 小测
        phone:
          type: string
          pattern: '^1[3456789]\d{9}$'
          description: 中国大陆手机号
          example: "13800138000"
        password:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
          description: 前端 SM3 后的 64 位十六进制摘要
          example: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        confirmPassword:
          type: string
          description: 确认密码（同样为 SM3 摘要，需与 password 一致）
          example: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        gender:
          type: integer
          description: 0-未知，1-男，2-女
          enum: [0, 1, 2]
          example: 1
        userType:
          type: integer
          description: 公开注册固定为 1（普通用户），该字段不再生效
          example: 1
    UpdateProfileRequest:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 50
          example: 小测
        avatar:
          type: string
          maxLength: 255
          description: 图片 URL 或以 / 开头的站内路径
          example: /files/bussiness/user_avatar/avatar.jpg
        phone:
          type: string
          pattern: '^$|^1[3456789]\d{9}$'
          example: "13800138000"
        gender:
          type: integer
          description: 0-未知，1-男，2-女
          enum: [0, 1, 2]
          example: 1
        birthday:
          type: string
          pattern: '^$|^\d{4}-\d{2}-\d{2}$'
          example: "2000-01-01"
    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: integer
          description: 0-禁用，1-正常
          enum: [0, 1]
          example: 0
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 50
          example: test@example.com
    ResetPasswordRequest:
      type: object
      required: [email, code, newPassword, confirmPassword]
      properties:
        email:
          type: string
          format: email
          maxLength: 50
          example: test@example.com
        code:
          type: string
          pattern: '^\d{6}$'
          example: "123456"
        newPassword:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
          description: 前端 SM3 后的 64 位十六进制摘要
          example: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        confirmPassword:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
          example: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    LoginData:
      type: object
      properties:
        token:
          type: string
          description: "Access Token，后续请求放入 Authorization: Bearer <token>"
        refreshToken:
          type: string
          description: 刷新凭证；Electron 端应在主进程加密存储
        expiresIn:
          type: integer
          format: int64
          description: Access Token 有效期（秒）
          example: 1800
        clientType:
          type: string
          enum: [DESKTOP, WEB]
          description: 本次登录使用的客户端类型
          example: WEB
        roleType:
          type: string
          description: 角色显示名，如 普通用户 / 管理员 / VIP
          example: 管理员
        userInfo:
          $ref: '#/components/schemas/UserDetail'
    UserDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: admin
        email:
          type: string
          nullable: true
          example: admin@example.com
        nickname:
          type: string
          nullable: true
          example: kk
        avatar:
          type: string
          nullable: true
          example: /files/bussiness/user_avatar/1757687320361.jpg
        phone:
          type: string
          nullable: true
          example: "19999525252"
        gender:
          type: integer
          nullable: true
          description: 0-未知，1-男，2-女
          example: 1
        genderDisplayName:
          type: string
          nullable: true
          example: 男
        birthday:
          type: string
          nullable: true
          description: yyyy-MM-dd
          example: "2019-09-02"
        userType:
          type: integer
          description: 1-普通用户，2-管理员，3-VIP
          enum: [1, 2, 3]
          example: 2
        userTypeDisplayName:
          type: string
          example: 管理员
        status:
          type: integer
          description: 0-禁用，1-启用
          enum: [0, 1]
          example: 1
        statusDisplayName:
          type: string
          example: 启用
        displayName:
          type: string
          example: kk
        createdAt:
          type: string
          description: yyyy-MM-dd HH:mm:ss
          example: "2025-08-30 12:00:01"
        updatedAt:
          type: string
          description: yyyy-MM-dd HH:mm:ss
          example: "2026-07-10 10:47:02"
    UserPage:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/UserDetail'
        total:
          type: integer
          format: int64
          example: 1
        page:
          type: integer
          format: int64
          example: 1
        size:
          type: integer
          format: int64
          example: 10
    OnlineUser:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: admin
        nickname:
          type: string
          nullable: true
          example: kk
        avatar:
          type: string
          nullable: true
        userType:
          type: integer
          description: 1-普通用户，2-管理员，3-VIP
