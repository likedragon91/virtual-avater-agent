openapi: 3.0.3
info:
  title: 虚拟形象 Agent 后端 API
  version: 1.0.0
  description: |
    虚拟形象 Agent 项目后端完整接口定义，可直接导入 Apifox。

    **导入约定**
    - 前置 URL 已写为 `http://127.0.0.1:1107/api`。
    - 下方所有 `paths` 均相对于 `/api`，例如 `/user/login`，不要再写 `/api` 前缀。
    - 需要登录的接口统一使用请求头 `Authorization: Bearer <JWT>`。
    - 统一响应格式为 `{"code":"200","msg":"操作成功","data":...}`。
    - 未登录/登录过期返回 **HTTP 401**；已登录但无权限返回 **HTTP 403**。
    - 参数校验失败、业务错误返回 **HTTP 200**，响应体中的 `code` 非 `"200"`
      （参数校验失败 `code="-2"`，业务错误为具体业务码）。
    - SSE 接口需要携带 Authorization 头，浏览器原生 `EventSource` 无法设置请求头，
      必须使用 `fetch + ReadableStream` 接收。
servers:
  - url: http://127.0.0.1:1107/api
    description: 本地开发（Apifox 前置 URL）
tags:
  - name: 账号
    description: 登录、注册、用户信息、用户列表、在线用户、退出登录
  - name: 验证码
    description: 图形验证码
  - name: Agent 会话
    description: 会话管理、历史消息、SSE 流式对话、停止生成
  - name: 任务与闹钟
    description: 任务 CRUD、提醒实例、完成度回应
  - name: 亲密度
    description: 当前关系状态与成长流水
  - name: 人格
    description: 人格预设、用户默认人格与风格特质
  - name: 通知
    description: 站内通知列表、未读数、已读、SSE 实时推送
  - name: 通知设置
    description: 免打扰窗口、主动消息开关
  - name: Web Push
    description: 浏览器推送订阅与测试
security:
  - bearerAuth: []
paths:
  /user/login:
    post:
      tags: [账号]
      summary: 登录
      operationId: userLogin
      security: []
      description: |
        公开接口。密码为前端 SM3 后的 64 位十六进制摘要，不是明文。
        验证码由 `GET /user/captcha` 获取；开启验证码时 captchaId/captchaCode 必传。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
              captchaId: 3f2b6c1e-8b7a-4f6e-9a1d-2c3d4e5f6a7b
              captchaCode: A1B2
              clientType: WEB
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultLogin'
              example:
                code: "200"
                msg: 操作成功
                data:
                  token: eyJhbGciOiJIUzI1NiJ9.xxx.yyy
                  refreshToken: eyJhbGciOiJIUzI1NiJ9.rrr.zzz
                  expiresIn: 1800
                  clientType: WEB
                  roleType: 管理员
                  userInfo:
                    id: 1
                    username: admin
                    email: admin@example.com
                    nickname: kk
                    avatar: /files/bussiness/user_avatar/1757687320361.jpg
                    phone: "19999525252"
                    gender: 1
                    genderDisplayName: 男
                    birthday: "2019-09-02"
                    userType: 2
                    userTypeDisplayName: 管理员
                    status: 1
                    statusDisplayName: 启用
                    displayName: kk
                    createdAt: "2025-08-30 12:00:01"
                    updatedAt: "2026-07-10 10:47:02"
  /user/refresh:
    post:
      tags: [账号]
      summary: 刷新会话
      operationId: userRefresh
      security: []
      description: |
        公开接口。使用 Refresh Token 换取新的 Access + Refresh（轮换）。
        已经轮换过的 Refresh Token 再次提交会被判定为重放，并撤销该用户全部会话。
        失败时沿用统一业务错误格式：HTTP 200，响应体 `code=401`，客户端应按 code 判断。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: eyJhbGciOiJIUzI1NiJ9.rrr.zzz
      responses:
        '200':
          description: 刷新成功；失败时响应体 code 为 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultLogin'
  /user/register:
    post:
      tags: [账号]
      summary: 注册
      operationId: userRegister
      security: []
      description: 公开接口。注册用户类型固定为普通用户（1）；password 与 confirmPassword 均为前端 SM3 摘要。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: test_user
              email: test@example.com
              nickname: 小测
              phone: "13800138000"
              password: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
              confirmPassword: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
              gender: 1
              userType: 1
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserDetail'
  /user/captcha:
    get:
      tags: [验证码]
      summary: 获取图形验证码
      operationId: getCaptcha
      security: []
      description: 返回 captchaId 与 PNG 图片的 Base64 Data URI，可直接用于 `<img src>`。
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCaptcha'
              example:
                code: "200"
                msg: 操作成功
                data:
                  captchaId: 3f2b6c1e-8b7a-4f6e-9a1d-2c3d4e5f6a7b
                  captchaImage: data:image/png;base64,iVBORw0KGgo...
  /user/message:
    get:
      tags: [账号]
      summary: 获取用户信息
      operationId: getUserMessage
      description: 传 `username` 时查询指定用户；不传时返回当前登录用户信息。
      parameters:
        - name: username
          in: query
          required: false
          description: 要查询的用户名；不传则查询当前登录用户
          schema:
            type: string
            maxLength: 50
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /user/list:
    get:
      tags: [账号]
      summary: 用户列表（管理员）
      operationId: listUsers
      description: 需要管理员权限（userType=2）。
      parameters:
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始
          schema:
            type: integer
            format: int64
            default: 1
            minimum: 1
        - name: size
          in: query
          required: false
          description: 每页条数
          schema:
            type: integer
            format: int64
            default: 10
            minimum: 1
        - name: keyword
          in: query
          required: false
          description: 用户名/昵称/邮箱等关键字
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserPage'
              example:
                code: "200"
                msg: 操作成功
                data:
                  records:
                    - id: 1
                      username: admin
                      email: admin@example.com
                      nickname: kk
                      avatar: null
                      phone: null
                      gender: 1
                      genderDisplayName: 男
                      birthday: null
                      userType: 2
                      userTypeDisplayName: 管理员
                      status: 1
                      statusDisplayName: 启用
                      displayName: kk
                      createdAt: "2025-08-30 12:00:01"
                      updatedAt: "2026-07-10 10:47:02"
                  total: 1
                  page: 1
                  size: 10
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/online:
    get:
      tags: [账号]
      summary: 在线用户列表（管理员）
      operationId: listOnlineUsers
      description: 需要管理员权限（userType=2）。
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOnlineUserList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/logout:
    post:
      tags: [账号]
      summary: 退出登录
      operationId: userLogout
      description: |
        撤销整段会话（Access + Refresh）并移除在线记录。
        接口允许公开访问：Access Token 已过期时，仍可仅凭 Refresh Token 撤销会话。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: eyJhbGciOiJIUzI1NiJ9.rrr.zzz
      responses:
        '200':
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
  /user/profile:
    put:
      tags: [账号]
      summary: 编辑当前用户资料
      operationId: updateUserProfile
      description: |
        当前登录用户编辑自己的资料。
        只允许修改昵称、头像、手机号、性别、生日；账号、邮箱、用户类型、状态不可自行修改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              nickname: 小测
              avatar: /files/bussiness/user_avatar/avatar.jpg
              phone: "13800138000"
              gender: 1
              birthday: "2000-01-01"
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /user/{id}/status:
    patch:
      tags: [账号]
      summary: 修改用户状态（管理员）
      operationId: updateUserStatus
      description: |
        管理员将用户状态改为正常（1）或禁用（0）。
        不能禁用当前登录账号，也不能禁用最后一个可用管理员。
        禁用后该用户现有 token 会被撤销。
      parameters:
        - name: id
          in: path
          required: true
          description: 目标用户 id
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
            example:
              status: 0
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/password/forgot:
    post:
      tags: [账号]
      summary: 发送找回密码验证码
      operationId: forgotPassword
      security: []
      description: |
        公开接口。向注册邮箱发送 6 位验证码，10 分钟有效。
        无论邮箱是否存在都返回成功，避免枚举账号；同一邮箱 60 秒内只能发送一次。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              email: test@example.com
      responses:
        '200':
          description: 请求已受理（不代表邮箱一定存在）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
  /user/password/reset:
    post:
      tags: [账号]
      summary: 使用邮箱验证码重置密码
      operationId: resetPassword
      security: []
      description: |
        公开接口。newPassword 与 confirmPassword 均为前端 SM3 后的 64 位十六进制摘要。
        验证码最多尝试 5 次，重置成功后该用户全部 token 失效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              email: test@example.com
              code: "123456"
              newPassword: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
              confirmPassword: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      responses:
        '200':
          description: 重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
  /agent/sessions:
    post:
      tags: [Agent 会话]
      summary: 新建会话
      operationId: createAgentSession
      description: 创建一个新的 Agent 会话。标题和人格编码都可省略。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
            example:
              title: 新的对话
              personaCode: default
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultChatSession'
              example:
                code: "200"
                msg: 操作成功
                data:
                  id: 1
                  title: 新的对话
                  personaCode: default
                  status: 1
                  messageCount: 0
                  lastActiveAt: "2026-11-12 20:00:00"
                  createdAt: "2026-11-12 20:00:00"
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Agent 会话]
      summary: 会话列表
      operationId: listAgentSessions
      description: 按最后活跃时间倒序返回当前用户的正常会话。
      parameters:
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始
          schema:
            type: integer
            format: int64
            default: 1
            minimum: 1
        - name: size
          in: query
          required: false
          description: 每页条数，最大 50
          schema:
            type: integer
            format: int64
            default: 20
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultSessionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /agent/sessions/{id}:
    get:
      tags: [Agent 会话]
      summary: 会话详情
      operationId: getAgentSession
      description: 只允许访问当前用户自己的会话；不存在或越权时返回业务错误。
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultChatSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Agent 会话]
      summary: 重命名 / 归档 / 切换会话人格
      operationId: updateAgentSession
      description: 只更新传入的字段。status 传 0 表示归档，归档会话不再出现在列表中，也不能继续发消息。
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
            example:
              title: 周报与面试
              status: 1
              personaCode: persona_warm
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultChatSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Agent 会话]
      summary: 删除会话
      operationId: deleteAgentSession
      description: 物理删除会话，消息与工具调用日志由数据库外键级联删除。
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /agent/sessions/{id}/messages:
    get:
      tags: [Agent 会话]
      summary: 历史消息
      operationId: listAgentMessages
      description: |
        按时间升序返回。cursor 为空时取最新一页；继续向前翻页时，把上一页的 nextCursor 传回。
        只返回 user / assistant 消息；生成中（status=0）的消息不返回。
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: cursor
          in: query
          required: false
          description: 上一页返回的 nextCursor；不传表示最新一页
          schema:
            type: integer
            format: int64
            nullable: true
        - name: size
          in: query
          required: false
          description: 每页条数，最大 50
          schema:
            type: integer
            format: int64
            default: 20
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultMessagePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /agent/sessions/{id}/messages/stream:
    post:
      tags: [Agent 会话]
      summary: 发送消息并流式回答（SSE）
      operationId: streamAgentMessage
      description: |
        发送一条用户消息，通过 SSE 返回 Agent 的流式回答。

        **必须使用 fetch + ReadableStream 接收**，浏览器原生 EventSource 不能携带 Authorization 头。

        事件顺序：
        - `meta`：`{runId, sessionId, assistantMessageId}`
        - `delta`：`{text}`，可多次
        - `tool_start`：`{callId, tool}`
        - `tool_end`：`{callId, ok, summary}`
        - `done`：`{runId, messageId, finishReason, usage.completionTokens}`
        - `error`：`{code, msg}`

        每个 `data` 都是 JSON 字符串，事件之间以空行分隔。
        流建立前的业务错误（越权、重复发送、已归档等）返回 `application/json`。
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            example:
              content: 我这周还有什么任务？
              clientMessageId: 3f2b6c1e-8b7a-4f6e-9a1d-2c3d4e5f6a7b
      responses:
        '200':
          description: SSE 流；若在流建立前失败，则返回 application/json
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                stream:
                  summary: 一次带工具调用的完整流
                  value: |
                    event: meta
                    data: {"runId":12,"sessionId":1,"assistantMessageId":12}

                    event: delta
                    data: {"text":"我先看看"}

                    event: tool_start
                    data: {"callId":"call_1","tool":"query_tasks"}

                    event: tool_end
                    data: {"callId":"call_1","ok":true,"summary":"找到 3 个任务"}

                    event: delta
                    data: {"text":"你这周还有 3 个任务。"}

                    event: done
                    data: {"runId":12,"messageId":12,"finishReason":"stop","usage":{"completionTokens":256}}
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: DUPLICATE_MESSAGE
                msg: 请勿重复发送同一条消息
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /agent/runs/{runId}/cancel:
    post:
      tags: [Agent 会话]
      summary: 停止生成
      operationId: cancelAgentRun
      description: runId 即 assistant 消息 id（SSE meta 事件中的 assistantMessageId）。
      parameters:
        - name: runId
          in: path
          required: true
          description: assistant 消息 id
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 已受理；若运行已结束则不做事
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tasks:
    post:
      tags: [任务与闹钟]
      summary: 新建任务
      operationId: createTask
      description: 创建事务闹钟任务，并根据 rrule 生成未来 30 天的提醒实例。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
            example:
              title: 提交周报
              note: 周五下班前提交
              dueAt: "2026-11-20 18:00:00"
              tz: Asia/Shanghai
              rrule: FREQ=WEEKLY;BYDAY=FR
              priority: 2
              responseWindowMinutes: 120
              allowNote: true
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [任务与闹钟]
      summary: 任务列表
      operationId: listTasks
      description: 按状态分页查询任务。`status` 不传默认 ACTIVE；传空字符串表示不过滤。
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int64
