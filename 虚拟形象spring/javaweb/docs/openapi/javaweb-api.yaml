  /notifications/stream:
    get:
      tags: [通知]
      summary: 通知实时推送（SSE）
      operationId: streamNotifications
      description: |
        建立长连接，接收站内通知。需要 Authorization 头，
        因此必须使用 fetch + ReadableStream 接收，不能使用原生 EventSource。

        事件：
        - `connected`：`{"ok":true}`
        - `notification`：通知对象（Notification）
        - `ping`：`{"ts":1730000000000}`，每 30 秒一次心跳
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                stream:
                  value: |
                    event: connected
                    data: {"ok":true}

                    event: notification
                    data: {"id":1,"type":"TASK_RINGING","title":"任务提醒","body":"该提交周报了","payload":{},"read":false,"createdAt":"2026-11-13 18:00:00"}

                    event: ping
